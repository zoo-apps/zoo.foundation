name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main, dev, test]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: [self-hosted, linux, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # This repo lives in `zoo-apps` but the image namespace is `ghcr.io/zooai`.
      # GITHUB_TOKEN is scoped to zoo-apps and CANNOT push cross-org to zooai, so
      # a PAT with write:packages on zooai is required (org/repo secret GHCR_PAT,
      # e.g. the hanzo-dev token). Until that secret is set, the manual evo build
      # is the live path.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GHCR_PAT }}

      - name: Compute tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::7}"
          TAGS="ghcr.io/zooai/foundation:sha-${SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},ghcr.io/zooai/foundation:${VER}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
